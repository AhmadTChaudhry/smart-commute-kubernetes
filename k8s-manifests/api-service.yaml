apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: 706262410757.dkr.ecr.ap-southeast-2.amazonaws.com/smartcommute-api-service:latest 
        ports:
        - containerPort: 3000
        env:
          - name: MONGO_URL
            value: "mongodb://mongo-db-service:27017"
        
        resources:
          requests:
            cpu: "100m" # Request 0.1 of a CPU core
            memory: "128Mi" # Request 128 Megabytes of RAM
          limits:
            cpu: "500m" # Limit to 0.5 of a CPU core
            memory: "256Mi" # Limit to 256 Megabytes of RAM
            
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: api-service-lb
spec:
  type: LoadBalancer 
  selector:
    app: api-service
  ports:
    - protocol: TCP
      port: 80 
      targetPort: 3000 