apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
      - name: processing-service
        image: 706262410757.dkr.ecr.ap-southeast-2.amazonaws.com/smartcommute-processing-service:latest # <-- IMPORTANT: REPLACE THIS
        env:
          - name: MONGO_URL
            value: "mongodb://mongo-db-service:27017"
          - name: MQTT_BROKER_URL
            value: "mqtt://node-red-service:1883"

        # --- BEST PRACTICES ADDED ---
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        # Startup probe removed because base image lacks mongosh; app itself logs readiness