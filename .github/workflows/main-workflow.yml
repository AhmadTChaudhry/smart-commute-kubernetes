name: CI/CD Pipeline for SmartCommute Microservices

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # This job runs first to determine which microservices have changed.
  filter:
    runs-on: ubuntu-latest
    outputs:
      api-service: ${{ steps.filter.outputs.api-service }}
      processing-service: ${{ steps.filter.outputs.processing-service }}
      node-red: ${{ steps.filter.outputs.node-red }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use paths-filter action
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-service:
              - 'api-service/**'
            processing-service:
              - 'processing-service/**'
            node-red:
              - 'node-red/**'

  # This job deploys the API service if its files have changed.
  deploy-api-service:
    needs: filter
    if: needs.filter.outputs.api-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations

      - name: Build and tag image
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 -t $ECR_REGISTRY/smartcommute-api-service:$IMAGE_TAG --load ./api-service
          echo "image=$ECR_REGISTRY/smartcommute-api-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Docker Scout Vulnerability Scan
        run: |
          docker scout cves ${{ steps.build-image.outputs.image }} --exit-code --only-severity critical,high

      - name: Push image to ECR
        run: docker push ${{ steps.build-image.outputs.image }}

      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ./k8s-manifests/api-service.yaml
          kubectl apply -f ./k8s-manifests/api-service.yaml

  # This job deploys the Processing service if its files have changed.
  deploy-processing-service:
    needs: filter
    if: needs.filter.outputs.processing-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations

      - name: Build and tag image
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 -t $ECR_REGISTRY/smartcommute-processing-service:$IMAGE_TAG --load ./processing-service
          echo "image=$ECR_REGISTRY/smartcommute-processing-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Docker Scout Vulnerability Scan
        run: |
          docker scout cves ${{ steps.build-image.outputs.image }} --exit-code --only-severity critical,high

      - name: Push image to ECR
        run: docker push ${{ steps.build-image.outputs.image }}

      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ./k8s-manifests/processing-service.yaml
          kubectl apply -f ./k8s-manifests/processing-service.yaml

  # This job deploys the Node-RED service if its files have changed.
  deploy-node-red:
    needs: filter
    if: needs.filter.outputs.node-red == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations

      - name: Build and tag image
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 -t $ECR_REGISTRY/smartcommute-nodered:$IMAGE_TAG --load ./node-red
          echo "image=$ECR_REGISTRY/smartcommute-nodered:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Docker Scout Vulnerability Scan
        run: |
          docker scout cves ${{ steps.build-image.outputs.image }} --exit-code --only-severity critical,high
      
      - name: Push image to ECR
        run: docker push ${{ steps.build-image.outputs.image }}

      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ./k8s-manifests/node-red.yaml
          kubectl apply -f ./k8s-manifests/node-red.yaml