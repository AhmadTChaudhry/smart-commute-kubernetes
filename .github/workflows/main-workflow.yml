name: CI/CD Pipeline for SmartCommute Microservices

# This workflow is triggered on every push to the 'main' branch
on:
  push:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# These permissions are required for the AWS OIDC authentication to work
permissions:
  id-token: write
  contents: read

jobs:
  # This job builds, scans, and deploys the API service
  deploy-api-service:
    # Only run this job if changes were made in the 'api-service' directory
    if: contains(github.event.head_commit.message, '[force deploy]') || contains(toJson(github.event.commits), 'api-service/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/smartcommute-api-service:$IMAGE_TAG ./api-service
          docker push $ECR_REGISTRY/smartcommute-api-service:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/smartcommute-api-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          # Use 'sed' to update the image tag in the Kubernetes manifest
          sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ./k8s-manifests/api-service.yaml
          
          # Apply the updated manifest to trigger a rolling update
          kubectl apply -f ./k8s-manifests/api-service.yaml

  # This job builds and deploys the Processing service
  deploy-processing-service:
    if: contains(github.event.head_commit.message, '[force deploy]') || contains(toJson(github.event.commits), 'processing-service/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/smartcommute-processing-service:$IMAGE_TAG ./processing-service
          docker push $ECR_REGISTRY/smartcommute-processing-service:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/smartcommute-processing-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ./k8s-manifests/processing-service.yaml
          kubectl apply -f ./k8s-manifests/processing-service.yaml

  # This job builds and deploys the Node-RED service
  deploy-node-red:
    if: contains(github.event.head_commit.message, '[force deploy]') || contains(toJson(github.event.commits), 'node-red/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/smartcommute-nodered:$IMAGE_TAG ./node-red
          docker push $ECR_REGISTRY/smartcommute-nodered:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/smartcommute-nodered:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ./k8s-manifests/node-red.yaml
          kubectl apply -f ./k8s-manifests/node-red.yaml
