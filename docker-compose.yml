services:
  # The API Service - Serves the frontend and the /vehicles endpoint
  api-service:
    build: ./api-service
    ports:
      - "3000:3000"
    depends_on:
      mongo-db:
        condition: service_healthy 
    environment:
      - MONGO_URL=mongodb://mongo-db:27017

  # The Processing Service - Listens to MQTT and writes to MongoDB
  processing-service:
    build: ./processing-service
    depends_on:
      mongo-db:
        condition: service_healthy
      node-red:
        condition: service_started 
    environment:
      - MONGO_URL=mongodb://mongo-db:27017
      - MQTT_BROKER_URL=mqtt://node-red:1883

  # The Node-RED MQTT Broker
  node-red:
    build: ./node-red  
    ports:
      - "1883:1883"
      - "1880:1880"
    volumes:
      - node-red-data:/data 

  # The MongoDB Database 
  mongo-db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck: 
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
  node-red-data: